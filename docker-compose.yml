# Brain Cockpit on any Linux box (Pi 5, NAS, old laptop).
#   1. mkdir data && cp config.example.json data/config.json  (fill it in —
#      use container paths: /vault, /inbox; whisper model under /data/models)
#   2. cp .env.example .env and put the API keys there (env-only, never in config)
#   3. docker compose up -d --build
# Optional profiles:
#   docker compose --profile sync up -d      # + syncthing sharing the vault
#   docker compose --profile tunnel up -d    # + cloudflared (TUNNEL_TOKEN in .env)
#   docker compose --profile proxy up -d     # + caddy HTTPS on your domain (DOMAIN in .env)
#   docker compose --profile applaud up -d   # + applaud, local-syncing a Plaud Note Pro
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # ANTHROPIC_API_KEY / GEMINI_API_KEY / … — keys live here only
      - path: .env
        required: false
    volumes:
      - ./data:/data # config.json, events.db, heartbeat, backups/, models/
      - ${VAULT_DIR:-./vault}:/vault # the Obsidian vault (the only source of truth)
      - ${INBOX_DIR:-./CaptureInbox}:/inbox # where new captures land

  # optional: syncthing keeps the vault in sync with your other machines
  syncthing:
    image: syncthing/syncthing:1
    profiles: ["sync"]
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${VAULT_DIR:-./vault}:/var/syncthing/vault
      - ./data/syncthing:/var/syncthing/config
    ports:
      - "8384:8384" # syncthing admin UI
      - "22000:22000" # sync protocol

  # optional: caddy terminates HTTPS with automatic Let's Encrypt certificates.
  # Point your domain's DNS at the server, set DOMAIN in .env, and use the
  # proxy profile — the VPS path in GO-LIVE.md. (Alternative: tunnel profile.)
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config

  # optional: cloudflared exposes the cockpit at your hostname (see DEPLOY.md)
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

  # optional: applaud locally syncs a Plaud Note Pro over the same LAN (no
  # cloud round-trip) and writes each recording as a bundle folder — audio +
  # transcript.txt/.json + summary.md — that pipeline/plaud.py already
  # recognises. Point PLAUD_RECORDINGS_DIR at a folder also listed in
  # config.json's watch_folders so ingest.sweep picks up what applaud writes.
  # First run: visit http://<host>:44471/setup and paste the device's pairing
  # token by hand (no browser-based device detection inside a container).
  applaud:
    image: ghcr.io/rsteckler/applaud:latest
    profiles: ["applaud"]
    restart: unless-stopped
    ports:
      - "44471:44471"
    volumes:
      - ./data/applaud:/data/config
      - ${PLAUD_RECORDINGS_DIR:-./data/plaud-recordings}:/data/recordings
